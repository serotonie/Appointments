name: Upstream Release Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to release (default: latest upstream release)"
        required: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: SergeyMosin/Appointments

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine upstream tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch upstream tag "${{ steps.tag.outputs.tag }}" --no-tags
          git merge --no-edit -X theirs "${{ steps.tag.outputs.tag }}"

      - name: Setup node
        if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.tag.outputs.skip != 'true'
        run: make dev-setup

      - name: Build frontend and app package
        if: steps.tag.outputs.skip != 'true'
        run: make appstore

      - name: Commit build, push and tag
        if: steps.tag.outputs.skip != 'true'
        run: |
          git add -A js css
          git diff --cached --quiet || git commit -m "Build frontend assets for ${{ steps.tag.outputs.tag }}"
          git push origin HEAD
          git tag -f "${{ steps.tag.outputs.tag }}"
          git push -f origin "refs/tags/${{ steps.tag.outputs.tag }}"

      - name: Create release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" build/artifacts/appstore/*.tar.gz \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Fork build of upstream release ${{ steps.tag.outputs.tag }} (https://github.com/$UPSTREAM_REPO/releases/tag/${{ steps.tag.outputs.tag }})."
